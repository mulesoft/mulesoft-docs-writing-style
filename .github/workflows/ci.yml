name: CI

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: mulesoft-ubuntu
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: jdkato/vale:v3.12.0

    - name: change permission
      run: chmod +x test-files/tests.sh
      
    - name: Run tests
      run: make test
      
    - name: Validate Vale configuration
      run: vale --config=.vale.ini --no-exit test-files/
      
