name: CI

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: mulesoft-ubuntu
    
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@v2.1.1
        with:
          fail_on_error: true
          files: test-files/
          version: 3.12.0
      - run: sudo apt-get install -y asciidoctor

